<!doctype html><html><head><meta charset="utf-8"><title>Speaker settings matrix</title><style>body{font:14px system-ui;margin:20px;background:#e4ece7;color:#18241f}#matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{min-width:0}.frame{overflow:hidden}iframe{border:0;transform-origin:top left}output{display:block}h2{font-size:14px}</style></head><body><h1>Speaker settings · 54 synthetic layout cases</h1><a href="./index.html?state=speakers">Named-speaker preview</a><p id="result">Checking…</p><div id="matrix"></div><script type="module">
let done=0,failed=0;
for(const theme of ['default','dark']) for(const size of ['small','medium','large']) for(const viewport of [[900,600],[1320,860],[1600,1000]]) for(const panel of [260,300,480]) {
 const [w,h]=viewport,article=document.createElement('article'),title=document.createElement('h2');title.textContent=`${theme} · ${size} · ${w}×${h} · ${panel}px`;article.append(title);
 const wrap=document.createElement('div');wrap.className='frame';article.append(wrap);
 const frame=document.createElement('iframe');frame.width=w;frame.height=h;frame.title=title.textContent;frame.src=`./frame.html?state=speakers&section=recording&theme=${theme}&size=${size}&panel=${panel}`;wrap.append(frame);
 const output=document.createElement('output');article.append(output);document.querySelector('#matrix').append(article);
 const resize=()=>{let scale=article.clientWidth/w;frame.style.transform=`scale(${scale})`;wrap.style.height=h*scale+'px'};resize();new ResizeObserver(resize).observe(article);
 frame.onload=()=>{let tries=0;const timer=setInterval(()=>{
  const doc=frame.contentDocument,card=doc.querySelector('.speaker-settings'),dock=doc.querySelector('.bottom-dock'),panel=doc.querySelector('.settings-panel');if((!card||!dock||!panel)&&tries++<60)return;
  clearInterval(timer);let issues=[];
  if(!card||!dock||!panel)issues.push('Missing UI');else{
   const d=dock.getBoundingClientRect(),p=panel.getBoundingClientRect();
   if(p.bottom>d.top||d.right>w||p.right>w)issues.push('Dock/panel collision');
   if(panel.scrollWidth>panel.clientWidth+1)issues.push('Panel overflow');
   if(!card.querySelector('input[type=checkbox]')?.labels.length)issues.push('Missing toggle label');
   if(!card.textContent.includes('experimental'))issues.push('Missing validation caveat');
   for(const el of card.querySelectorAll('button,p,span'))if(parseFloat(frame.contentWindow.getComputedStyle(el).fontSize)<13)issues.push('Small text');
  }
  if(issues.length)failed++;done++;output.textContent=issues.length?issues.join('; '):'PASS';document.querySelector('#result').textContent=`${done}/54 checked · ${failed} failures`;
 },150)};
}
</script></body></html>
